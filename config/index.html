<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kami Settings</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --text: #1d1b18;
    --muted: #6b665d;
    --line: #e4e0d6;
    --accent: #b4442c;
    --accent-text: #ffffff;
    --field: #fbfaf7;
    --danger: #a3302a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141312;
      --card: #1e1c1a;
      --text: #ece8e1;
      --muted: #9c968c;
      --line: #33302c;
      --accent: #e0694d;
      --accent-text: #1a0d09;
      --field: #191816;
      --danger: #f07a70;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: max(16px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 520px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 20px; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
  h2 {
    font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin: 28px 0 8px;
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .book { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .book + .book { border-top: 1px solid var(--line); }
  .book-info { flex: 1; min-width: 0; }
  .book-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book-meta { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    font-size: 12px; font-weight: 600; color: var(--accent);
    border: 1px solid currentColor; border-radius: 999px; padding: 2px 8px; white-space: nowrap;
  }
  .empty { padding: 16px; color: var(--muted); }
  button {
    font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--field);
    color: var(--text); padding: 8px 12px; cursor: pointer; white-space: nowrap;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.danger { color: var(--danger); }
  button.danger.armed { background: var(--danger); border-color: var(--danger); color: var(--card); font-weight: 600; }
  button.link { border: none; background: none; color: var(--muted); padding: 8px 0; }
  form { padding: 16px; display: grid; gap: 12px; }
  label { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
  input {
    font: inherit; width: 100%; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--field); color: var(--text);
  }
  input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hint { font-size: 14px; color: var(--muted); margin: 0; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 16px; }
  .suggestions button { font-size: 14px; padding: 6px 10px; }
  .error { color: var(--danger); font-size: 14px; margin: 0; min-height: 1em; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Kami</h1>
    <button class="link" id="done" type="button">Done</button>
  </header>

  <h2>Library</h2>
  <div class="card" id="library"></div>

  <h2>Add a book</h2>
  <div class="card">
    <form id="add-form" novalidate>
      <label>
        Link to the book
        <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="gutenberg.org/ebooks/1342">
      </label>
      <label>
        Title <span>(optional, read from the book if left blank)</span>
        <input id="title" type="text" autocomplete="off">
      </label>
      <p class="hint">A Project Gutenberg book page, or a link to any plain-text (.txt) file.</p>
      <p class="error" id="error" role="alert"></p>
      <button class="primary" type="submit">Add and start reading</button>
    </form>
    <div class="suggestions" id="suggestions"></div>
  </div>
</main>

<script>
(function () {
  var SUGGESTIONS = [
    { id: 1342, title: 'Pride and Prejudice' },
    { id: 11, title: "Alice's Adventures in Wonderland" },
    { id: 84, title: 'Frankenstein' },
    { id: 1661, title: 'The Adventures of Sherlock Holmes' },
    { id: 2701, title: 'Moby Dick' }
  ];

  // Library state is passed by the watch app in the URL hash
  var state = { current: 0, books: [] };
  try {
    var hash = location.hash.slice(1);
    if (hash) state = JSON.parse(decodeURIComponent(hash));
  } catch (e) { /* show an empty library */ }

  function returnTo() {
    var m = location.search.match(/[?&]return_to=([^&]*)/);
    return m ? decodeURIComponent(m[1]) : 'pebblejs://close#';
  }

  function finish(action) {
    location.href = returnTo() + (action ? encodeURIComponent(JSON.stringify(action)) : '');
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    for (var k in attrs) {
      if (k === 'text') node.textContent = attrs[k];
      else if (k === 'onclick') node.addEventListener('click', attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function hostOf(url) {
    var m = String(url || '').match(/^https?:\/\/([^/]+)/i);
    return m ? m[1].replace(/^www\./, '') : '';
  }

  // The Pebble app's web view doesn't show confirm() dialogs (it returns
  // false), so confirm in place: first tap arms the button, second removes.
  function removeButton(b) {
    var armed = false;
    var timer = null;
    var btn = el('button', {
      type: 'button', class: 'danger', text: 'Remove', 'aria-label': 'Remove ' + (b.title || 'book'),
      onclick: function () {
        if (armed) {
          finish({ remove: b.id });
          return;
        }
        armed = true;
        btn.textContent = 'Tap to confirm';
        btn.classList.add('armed');
        timer = setTimeout(function () {
          armed = false;
          btn.textContent = 'Remove';
          btn.classList.remove('armed');
        }, 4000);
      }
    });
    return btn;
  }

  function renderLibrary() {
    var box = document.getElementById('library');
    box.textContent = '';
    var books = (state.books || []).slice().reverse();
    if (!books.length) {
      box.appendChild(el('div', { class: 'empty', text: 'No books yet. The watch is showing the sample book.' }));
      return;
    }
    books.forEach(function (b) {
      var isCurrent = b.id === state.current;
      box.appendChild(el('div', { class: 'book' }, [
        el('div', { class: 'book-info' }, [
          el('div', { class: 'book-title', text: b.title || 'Not downloaded yet' }),
          el('div', { class: 'book-meta', text: b.author || hostOf(b.url) })
        ]),
        isCurrent
          ? el('span', { class: 'badge', text: 'Reading' })
          : el('button', { type: 'button', text: 'Read', onclick: function () { finish({ open: b.id }); } }),
        removeButton(b)
      ]));
    });
  }

  function renderSuggestions() {
    var box = document.getElementById('suggestions');
    SUGGESTIONS.forEach(function (s) {
      box.appendChild(el('button', {
        type: 'button', text: s.title,
        onclick: function () {
          finish({ add: { url: 'https://www.gutenberg.org/ebooks/' + s.id, title: s.title } });
        }
      }));
    });
  }

  document.getElementById('add-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var url = document.getElementById('url').value.trim();
    var title = document.getElementById('title').value.trim();
    var error = document.getElementById('error');
    if (!url) {
      error.textContent = 'Paste a link to a book first.';
      return;
    }
    if (/\s/.test(url) || url.indexOf('.') < 0) {
      error.textContent = "That doesn't look like a link.";
      return;
    }
    finish({ add: { url: url, title: title } });
  });

  document.getElementById('done').addEventListener('click', function () { finish(null); });

  renderLibrary();
  renderSuggestions();
})();
</script>
</body>
</html>
